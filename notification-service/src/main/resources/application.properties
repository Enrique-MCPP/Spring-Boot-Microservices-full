eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka
spring.application.name=notification-service
server.port=0
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1

# Kafka Properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=notificationTopic
##Es obligatorio el id en el consumer
spring.kafka.consumer.group-id=notificationId
##En el consumer usamos deserializer para leer la informaci�n
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
##En el consumer usamos JsonDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=event:com.programming.techie.OrderPlacedEvent
##Leer desde el principio si no hay offset previo
spring.kafka.consumer.auto-offset-reset=earliest
##Confiar en todos los paquetes para deserializaci�n
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Actuator Prometheus Endpoint
management.endpoints.web.exposure.include= prometheus